# 可选：只处理指定仓库（写 owner/repo）
# include:
#   - my-fork/project-a

# 可选：排除指定仓库
# exclude:
#   - my-fork/old-project

# Web 端口（默认 8000）
web_port: 8000

# 是否在页面展示被跳过的仓库（如 HTTP 451 等），默认 true
# show_skipped: false

# 可选：网络代理（优先级高于环境变量 HTTPS_PROXY）
# 支持 http/https/socks5 代理
# proxy: http://127.0.0.1:7890
# proxy: socks5://127.0.0.1:1080
